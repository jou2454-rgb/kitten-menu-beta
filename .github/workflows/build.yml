name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: unpack
        run: '[ -f KittenMenu.zip ] && unzip -q KittenMenu.zip || true'
      - name: build
        working-directory: KittenMenu
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kitten-apk
          path: KittenMenu/app/build/outputs/apk/debug/app-debug.apk
